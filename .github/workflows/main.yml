name: Android CI Build Pro

# يشتغل البناء بكل مرة ترفع كود (Push) لفرع main
on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest # سيرفر لينكس حديث

    steps:
    # 1. سحب الكود من المستودع
    - name: Checkout Code
      uses: actions/checkout@v4

    # 2. تجهيز البيئة (جافا 17)
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    # 3. تثبيت الجرادل تلقائياً (الحل لمشكلة الملفات الناقصة)
    - name: Setup Gradle
      uses: gradle/gradle-build-action@v3
      with:
        gradle-version: 8.0 # راح يحمل الجرادل بدون ما يحتاج ملف gradlew من عندك

    # 4. بناء نسخة الـ APK
    - name: Build with Gradle
      run: gradle assembleDebug

    # 5. رفع ملف الـ APK الجاهز للتحميل
    - name: Upload APK Result
      uses: actions/upload-artifact@v4
      with:
        name: Hussein-Monitor-App
        path: app/build/outputs/apk/debug/app-debug.apk
