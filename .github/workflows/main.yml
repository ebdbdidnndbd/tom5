name: Android CI Build Pro

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v3 # التحديث لأحدث نسخة من الأداة
      with:
        gradle-version: '8.5' # كتبناها بدقة وبالفوارز حتى ما يعترض

    - name: Build with Gradle
      run: gradle assembleDebug

    - name: Upload APK Result
      uses: actions/upload-artifact@v4
      with:
        name: Hussein-Monitor-App
        path: app/build/outputs/apk/debug/app-debug.apk
